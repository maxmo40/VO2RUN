<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VO2RUN — Mon espace</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell wide-shell">
      <div class="auth-card profile-card-page">
        <a class="back-link" href="./index.html">← Retour au site</a>
        <h1>Mon espace</h1>

        <div class="profile-summary">
          <div class="profile-row">
            <span class="profile-label">Email</span>
            <strong id="profileEmail">—</strong>
          </div>
        </div>

        <form id="profileForm" class="auth-form profile-form">
          <div class="field-grid">
            <label>
              Prénom
              <input type="text" name="firstName" placeholder="Votre prénom" />
            </label>
            <label>
              Nom
              <input type="text" name="lastName" placeholder="Votre nom" />
            </label>
            <label>
              Date de naissance
              <input type="date" name="birthDate" />
            </label>
            <label>
              Taille (cm)
              <input type="number" name="height" min="120" max="220" placeholder="175" />
            </label>
            <label>
              Poids (kg)
              <input type="number" name="weight" min="30" max="200" placeholder="68" />
            </label>
          </div>

          <button type="submit" class="btn primary">Enregistrer mes informations</button>
          <div id="profileMessage" class="auth-message" aria-live="polite"></div>
        </form>

        <div style="margin-top:20px; display:grid; gap:10px;">
          <button class="btn primary" type="button" id="goHomeBtn">Retour à l'accueil</button>
          <button class="btn" type="button" id="logoutBtn">Se déconnecter</button>
        </div>
      </div>
    </main>

    <script>
      const API_BASE_URL = window.__API_URL__ || (
        window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
          ? window.location.origin
          : 'https://vo2run-production.up.railway.app'
      );
      const authStateKey = 'vo2run-auth';
      const profileKey = 'vo2run-profile';
      const profileEmail = document.getElementById('profileEmail');
      const profileForm = document.getElementById('profileForm');
      const profileMessage = document.getElementById('profileMessage');
      const logoutBtn = document.getElementById('logoutBtn');
      const goHomeBtn = document.getElementById('goHomeBtn');

      const firstNameInput = profileForm.elements.namedItem('firstName');
      const lastNameInput = profileForm.elements.namedItem('lastName');
      const birthDateInput = profileForm.elements.namedItem('birthDate');
      const heightInput = profileForm.elements.namedItem('height');
      const weightInput = profileForm.elements.namedItem('weight');

      function readStoredProfile() {
        try {
          const raw = localStorage.getItem(profileKey);
          return raw ? JSON.parse(raw) : {};
        } catch (error) {
          console.warn('Invalid saved profile', error);
          localStorage.removeItem(profileKey);
          return {};
        }
      }

      function setFieldValue(input, value) {
        if (input && value !== undefined && value !== null && value !== '') {
          input.value = value;
        }
      }

      async function loadUser() {
        try {
          const response = await fetch(`${API_BASE_URL}/api/me`, { credentials: 'include' });
          if (!response.ok) {
            throw new Error('not authenticated');
          }
          const user = await response.json();
          profileEmail.textContent = user.email || '—';
          localStorage.setItem(authStateKey, JSON.stringify({ email: user.email, name: user.name || 'Utilisateur' }));

          const saved = readStoredProfile();
          setFieldValue(firstNameInput, saved.firstName);
          setFieldValue(lastNameInput, saved.lastName);
          setFieldValue(birthDateInput, saved.birthDate);
          setFieldValue(heightInput, saved.height);
          setFieldValue(weightInput, saved.weight);
        } catch (error) {
          localStorage.removeItem(authStateKey);
          window.location.replace('./login.html');
        }
      }

      profileForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const data = {
          firstName: (firstNameInput && firstNameInput.value ? firstNameInput.value.trim() : ''),
          lastName: (lastNameInput && lastNameInput.value ? lastNameInput.value.trim() : ''),
          birthDate: birthDateInput ? birthDateInput.value : '',
          height: heightInput ? heightInput.value : '',
          weight: weightInput ? weightInput.value : '',
        };

        try {
          localStorage.setItem(profileKey, JSON.stringify(data));
          profileMessage.textContent = 'Informations enregistrées.';
        } catch (error) {
          console.warn('Could not save profile locally', error);
          profileMessage.textContent = 'Erreur d’enregistrement local. Merci de réessayer.';
        }
      });

      logoutBtn.addEventListener('click', async () => {
        try {
          await fetch(`${API_BASE_URL}/api/logout`, {
            method: 'POST',
            credentials: 'include',
          });
        } catch (error) {
          console.warn('Logout API unavailable', error);
        }
        localStorage.removeItem(authStateKey);
        localStorage.removeItem(profileKey);
        window.location.href = './index.html';
      });

      goHomeBtn.addEventListener('click', () => {
        window.location.href = './index.html';
      });

      loadUser();
    </script>
  </body>
</html>
